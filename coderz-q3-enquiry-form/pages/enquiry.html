<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أسئلة عن الكورس</title>
</head>
<body>
      <header>
    <nav aria-label="التنقل بين الصفحات">
        <a href="../index.html">الرئيسية</a> |
        <a href="courses.html">الكورسات</a> |
        <a href="contact.html">تواصل معنا</a> |
        <a href="schedule.html">المواعيد</a> |
        <a href="enquiry.html">الاستفسار</a>
    </nav>
    </header>
    
    <main>
        <h1>استفسر عن الكورس</h1>
    <form>
        <label for="full_name">الاسم كامل:</label>
        <input type="text" id="full_name" name="full_name" placeholder="ادخل اسمك الكامل" autocomplete="name" required>
        <br> <br>
        <label for="email">البريد الالكتروني:</label>
        <input type="email" id="email" name="email" required>
        <br> <br>
        <label for="phone">رقم الهاتف:</label>
        <input type="tel" id="phone" name="phone" required>
        <br> <br>

        <label for="course">اختر الكورس:</label>
        <select id="course" name="course" required>
            <option value="">اختر كورس</option>
            <option value="html_content">HTML Content</option>
            <option value="html_forms">HTML Forms</option>
        </select>
        <br><br>

        <label for="seats">عدد المقاعد:</label>
            <input type="number" id="seats" name="seats"
                   min="1" value="1" required>

            <br><br>

            <label for="date">التاريخ المفضل:</label>
            <input type="date" id="date" name="date">

            <br><br>

            <label for="message">نص الاستفسار:</label>
            <br>
            <textarea id="message" name="message"
                      rows="5" cols="40" required></textarea>

            <br><br>

            <button type="submit">إرسال الاستفسار</button>

    </form>


    </main>
    
       <footer>
        <p>معهد Coderz</p>
    </footer>
    
</body>
</html>
